<!doctype html>
<html lang="{{ language }}" dir="{{ 'rtl' if language == 'ar' else 'ltr' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ t('Manazil') }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block scripts %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">{{ t('Skip to content') }}</a>
    <header class="site-header">
      <a class="site-brand" href="{{ url_for('main.index', **({'lang': 'en'} if language == 'en' else {})) }}">{{ t('Manazil') }}</a>
      <nav aria-label="{{ 'التنقل الرئيسي' if language == 'ar' else 'Main navigation' }}">
        <a href="{{ url_for('main.index', **({'lang': 'en'} if language == 'en' else {})) }}" {% if request.endpoint == 'main.index' %}aria-current="page"{% endif %}>{{ t('Home') }}</a>
        <a href="{{ url_for('admin.new_property', **({'lang': 'en'} if language == 'en' else {})) }}" {% if request.blueprint == 'admin' %}aria-current="page"{% endif %}>{{ t('List Your Property') }}</a>
      </nav>
      <div class="language-switcher" aria-label="{{ 'اللغة' if language == 'ar' else 'Language' }}">
        {% block language_switcher %}
          <a href="{{ url_for('main.index') }}" lang="ar" {% if language == 'ar' %}aria-current="true"{% endif %}>العربية</a>
          <span aria-hidden="true">|</span>
          <a href="{{ url_for('main.index', lang='en') }}" lang="en" {% if language == 'en' %}aria-current="true"{% endif %}>English</a>
        {% endblock %}
      </div>
    </header>
    {% block content %}{% endblock %}
    <footer class="site-footer">{{ t('Manazil') }} <span aria-hidden="true">·</span> {{ t('Sudan Property Rental Platform') }}</footer>
  </body>
</html>
