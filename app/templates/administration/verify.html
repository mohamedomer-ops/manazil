{% extends 'administration/base.html' %}{% block title %}{{ t('Verification code') }}{% endblock %}
{% block content %}<section class="admin-login-card"><h1>{{ t('Verification code') }}</h1><p>{{ t('Enter the 6-digit verification code.') }}</p>
{% if error %}<p class="admin-error" role="alert">{{ t(error) }}</p>{% endif %}
<form method="post" action="{{ url_for('admin_portal.verify_post') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="_language" value="{{ language }}"><label for="admin-code">{{ t('Verification code') }}</label><input id="admin-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required><button class="admin-primary" type="submit">{{ t('Verify') }}</button></form><form method="post" action="{{ url_for('admin_portal.resend') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="_language" value="{{ language }}"><button class="admin-link-button" type="submit">{{ t('Resend code') }}</button></form></section>{% endblock %}
