{% extends 'administration/base.html' %}{% block title %}{{ t('Admin Login') }}{% endblock %}
{% block content %}<section class="admin-login-card"><h1>{{ t('Admin Login') }}</h1><p>{{ t('Sign in with your administrator phone number.') }}</p>
{% if error %}<p class="admin-error" role="alert">{{ t(error) }}</p>{% endif %}
<form method="post" action="{{ url_for('admin_portal.login_post') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next }}"><input type="hidden" name="_language" value="{{ language }}">
<label for="admin-phone">{{ t('Phone Number') }}</label><input id="admin-phone" name="phone_number" type="tel" autocomplete="tel" required>
<button class="admin-primary" type="submit">{{ t('Continue') }}</button></form></section>{% endblock %}
