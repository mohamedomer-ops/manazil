{% extends 'auth/recovery_base.html' %}
{% block recovery_content %}
<p class="signin-card-subtitle">{{ t('Enter your email to request a password reset code.') }}</p>
<form method="post" action="{{ url_for('auth.forgot_password') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="_language" value="{{ language }}">
  <label for="email">{{ t('Email address') }}</label>
  <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required dir="ltr">
  <button class="signin-submit" type="submit">{{ t('Send reset code') }}</button>
</form>
<p class="auth-field-help">{{ t('If you normally use Google, continue with Google.') }}</p>
{% endblock %}
