{% extends 'base.html' %}
{% block title %}{{ t('Login') }} · {{ t('Manazil') }}{% endblock %}
{% block content %}
<main id="main-content" class="form-page">
  <h1>{{ t('Login') }}</h1>
  <p>{{ t("We'll send a verification code to your number.") }}</p>
  {% if error %}<p role="alert">{{ t(error) }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.request_otp') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="_language" value="{{ language }}">
    <label for="phone_number">{{ t('Phone number') }}</label>
    <input id="phone_number" name="phone_number" type="tel" autocomplete="tel" required>
    <button type="submit">{{ t('Continue') }}</button>
  </form>
</main>
{% endblock %}
