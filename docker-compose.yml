services:
  web:
    build: .
    command: python run.py
    ports:
      - "5000:5000"
    volumes:
      - photo_data:/app/instance/property_photos
    environment:
      DATABASE_URL: postgresql+psycopg://manazil@db:5432/manazil
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OTP_DEVELOPMENT_MODE: "1"
      MANAZIL_ENV: "development"
      PHOTO_STORAGE_BACKEND: "local"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PUBLIC_GOOGLE_LOGIN_ENABLED: ${PUBLIC_GOOGLE_LOGIN_ENABLED:-0}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: manazil
      POSTGRES_USER: manazil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manazil -d manazil"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  photo_data:
